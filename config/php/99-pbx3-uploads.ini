; PBX3 API — multipart uploads (tenant MOH, backups, etc.)
; Keep aligned with nginx client_max_body_size and Laravel file max rules.
; post_max_size must exceed upload_max_filesize (multipart overhead).
upload_max_filesize = 50M
post_max_size = 55M

; Pre-patch stopgap for session.upload_progress UAF research (2026-10):
; prefork-only path; nginx+FPM is outside the confirmed SAPI, but Off is
; harmless (Laravel/Sanctum unused) and closes the named entry point.
; Keep until upstream PHP advisory + package roll; then reassess.
session.upload_progress.enabled = Off
